<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wikipedia Research Assistant</title>
<style>
body,html{margin:0;padding:0;height:100%;overflow:hidden;font-family:sans-serif;background:#f6f6f6;}
.navbar{height:50px;background:#fff;border-bottom:1px solid #aaa;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.search-box{display:flex;align-items:center;gap:10px;}
.calc-toggle{padding:6px 12px;background:#ff9800;color:white;border:none;border-radius:4px;cursor:pointer;font-weight:bold;}
.calc-toggle:hover{background:#e65100;}
.secret-btn{width:10px;height:10px;background:#e0e0e0;border-radius:50%;cursor:pointer;}
.dashboard{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#111;color:#fff;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.lock-panel{display:flex;flex-direction:column;align-items:center;background:#222;padding:20px;border-radius:8px;}
.lock-panel input{padding:8px;background:#000;color:#0f0;border:1px solid #444;border-radius:4px;text-align:center;margin-bottom:10px;}
.game-panel{display:none;flex-direction:column;align-items:center;}
.menu{margin-bottom:15px;}
button{padding:8px 15px;margin:0 5px;background:#333;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;}
button.active{background:#4CAF50;}
.win{display:none;flex-direction:column;align-items:center;} .win.active{display:flex;}
canvas{background:#000;border:3px solid #444;cursor:pointer;}
.ai-widget{position:fixed;bottom:20px;right:20px;width:60px;height:60px;background:#3366cc;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.3);z-index:1000;transition:0.2s;}
.ai-widget:hover{background:#2a52be;transform:scale(1.05);}
.ai-box{display:none;position:fixed;bottom:90px;right:20px;width:300px;height:380px;background:#ffffff;border:1px solid #ccc;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.2);z-index:1000;flex-direction:column;font-family:sans-serif;}
.ai-header{background:#3366cc;color:white;padding:12px;font-weight:bold;font-size:14px;border-top-left-radius:7px;border-top-right-radius:7px;}
.ai-body{flex:1;padding:10px;overflow-y:auto;background:#f9f9f9;font-size:13px;display:flex;flex-direction:column;gap:8px;}
.chat-msg{padding:8px 12px;border-radius:6px;max-width:80%;word-wrap:break-word;}
.msg-ai{background:#e2eafd;color:#202122;align-self:flex-start;}
.msg-user{background:#3366cc;color:white;align-self:flex-end;}
.ai-footer{display:flex;padding:10px;border-top:1px solid #eee;background:#fff;border-bottom-left-radius:7px;border-bottom-right-radius:7px;}
.ai-footer input{flex:1;padding:6px;border:1px solid #ccc;border-radius:4px;outline:none;font-size:13px;}
.ai-footer button{padding:6px 12px;background:#3366cc;color:white;border:none;}
.calc-box{display:none;position:fixed;top:70px;left:20px;width:220px;background:#333;padding:15px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.3);z-index:1010;}
.calc-screen{width:100%;height:40px;background:#a1b5a1;color:#000;border:none;border-radius:4px;text-align:right;padding:5px;font-size:18px;font-family:monospace;margin-bottom:10px;box-sizing:border-box;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.calc-btn{padding:10px;background:#555;color:#fff;border:none;border-radius:4px;font-weight:bold;cursor:pointer;font-size:14px;}
.calc-btn:hover{background:#777;}
.calc-btn.op{background:#ff9800;}
.calc-btn.op:hover{background:#ffa726;}
</style>
</head>
<body>
<div class="navbar">
<div class="search-box">
<div>🌐 Wikipedia Research Assistant</div>
<button class="calc-toggle" onclick="toggleCalc()">Math Tool</button>
</div>
<div class="secret-btn" onclick="toggleDashboard()"></div>
</div>
<iframe id="wf" src="https://wikipedia.org" style="width:100%;height:calc(100% - 50px);border:none;"></iframe>

<div id="calcBox" class="calc-box">
<input type="text" id="calcDisplay" class="calc-screen" readonly value="0">
<div class="calc-grid">
<button class="calc-btn" onclick="clearCalc()">C</button>
<button class="calc-btn" onclick="pressCalc('/')">/</button>
<button class="calc-btn" onclick="pressCalc('*')">*</button>
<button class="calc-btn" onclick="pressCalc('-')">-</button>
<button class="calc-btn" onclick="pressCalc('7')">7</button>
<button class="calc-btn" onclick="pressCalc('8')">8</button>
<button class="calc-btn" onclick="pressCalc('9')">9</button>
<button class="calc-btn op" onclick="pressCalc('+')">+</button>
<button class="calc-btn" onclick="pressCalc('4')">4</button>
<button class="calc-btn" onclick="pressCalc('5')">5</button>
<button class="calc-btn" onclick="pressCalc('6')">6</button>
<button class="calc-btn op" onclick="solveCalc()">=</button>
<button class="calc-btn" onclick="pressCalc('1')">1</button>
<button class="calc-btn" onclick="pressCalc('2')">2</button>
<button class="calc-btn" onclick="pressCalc('3')">3</button>
<button class="calc-btn" onclick="pressCalc('0')">0</button>
</div>
</div>
<div class="ai-widget" onclick="toggleAI()">🤖</div>
<div id="aiBox" class="ai-box">
<div class="ai-header">Core Research Assistant v1.0</div>
<div id="aiBody" class="ai-body">
<div class="chat-msg msg-ai">Hello! Type a topic to search Wikipedia directly.</div>
</div>
<div class="ai-footer">
<input type="text" id="aiInput" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendAIQuery()">
<button onclick="sendAIQuery()">Ask</button>
</div>
</div>

<div id="dash" class="dashboard">
<div id="lock" class="lock-panel">
<h3>SECURITY GATEWAY</h3>
<input type="password" id="pw" placeholder="ACCESS CODE" onkeydown="if(event.key==='Enter') verify()">
<button onclick="verify()">SUBMIT</button>
</div>
<div id="games" class="game-panel">
<div class="menu">
<button id="b-s" class="active" onclick="setG('s')">Smooth Snake</button>
<button id="b-fb" onclick="setG('fb')">Flappy Bird</button>
<button id="b-ttt" onclick="setG('ttt')">TicTacToe</button>
<button id="b-m" onclick="setG('m')">Maze Escape</button>
</div>
<div id="w-s" class="win active"><canvas id="c-s" width="300" height="300"></canvas><div>Score: <span id="s-s">0</span></div></div>
<div id="w-fb" class="win"><canvas id="c-fb" width="320" height="320"></canvas><div>Score: <span id="s-f">0</span></div></div>
<div id="w-ttt" class="win"><canvas id="c-ttt" width="240" height="240"></canvas><div id="s-ttt" style="font-family:monospace;color:#aaa;margin-top:5px;">Your Turn</div></div>
<div id="w-m" class="win"><canvas id="c-m" width="300" height="300"></canvas><div id="s-m" style="font-family:monospace;color:#aaa;margin-top:5px;">Escape to the Yellow Square!</div></div>
<p style="color:#666;font-size:12px;margin-top:15px;">Press ESC key or click top-right dot to exit instantly</p>
</div>
</div>
