<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wikipedia Research Assistant</title>
<style>
body,html{margin:0;padding:0;height:100%;overflow:hidden;font-family:sans-serif;background:#f6f6f6;}
.navbar{height:50px;background:#fff;border-bottom:1px solid #aaa;display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.search-box{display:flex;align-items:center;gap:10px;}
.calc-toggle{padding:6px 12px;background:#ff9800;color:white;border:none;border-radius:4px;cursor:pointer;font-weight:bold;}
.calc-toggle:hover{background:#e65100;}
.secret-btn{width:10px;height:10px;background:#e0e0e0;border-radius:50%;cursor:pointer;}
.dashboard{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#111;color:#fff;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.lock-panel{display:flex;flex-direction:column;align-items:center;background:#222;padding:20px;border-radius:8px;}
.lock-panel input{padding:8px;background:#000;color:#0f0;border:1px solid #444;border-radius:4px;text-align:center;margin-bottom:10px;}
.game-panel{display:none;flex-direction:column;align-items:center;}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:15px;}
button.g-btn{padding:8px 12px;background:#333;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-size:12px;}
button.g-btn.active{background:#4CAF50;}
.win{display:none;flex-direction:column;align-items:center;} .win.active{display:flex;}
canvas{background:#000;border:3px solid #444;cursor:pointer;}
.ai-widget{position:fixed;bottom:20px;right:20px;width:60px;height:60px;background:#3366cc;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.3);z-index:1000;}
.ai-box{display:none;position:fixed;bottom:90px;right:20px;width:300px;height:350px;background:#fff;border:1px solid #ccc;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.2);z-index:1000;flex-direction:column;}
.ai-header{background:#3366cc;color:white;padding:10px;font-weight:bold;font-size:13px;border-top-left-radius:7px;border-top-right-radius:7px;}
.ai-body{flex:1;padding:10px;overflow-y:auto;background:#f9f9f9;font-size:12px;display:flex;flex-direction:column;gap:6px;}
.chat-msg{padding:6px 10px;border-radius:6px;max-width:80%;word-wrap:break-word;}
.msg-ai{background:#e2eafd;color:#202122;align-self:flex-start;}
.msg-user{background:#3366cc;color:white;align-self:flex-end;}
.ai-footer{display:flex;padding:8px;border-top:1px solid #eee;}
.ai-footer input{flex:1;padding:6px;border:1px solid #ccc;border-radius:4px;outline:none;}
.ai-footer button{padding:6px 12px;background:#3366cc;color:white;border:none;border-radius:4px;margin-left:4px;cursor:pointer;}
.calc-box{display:none;position:fixed;top:70px;left:20px;width:200px;background:#333;padding:12px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.3);z-index:1001;}
.calc-screen{width:100%;height:35px;background:#a1b5a1;color:#000;border:none;border-radius:4px;text-align:right;padding:5px;font-size:16px;font-family:monospace;margin-bottom:8px;box-sizing:border-box;}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.calc-btn{padding:8px;background:#555;color:#fff;border:none;border-radius:4px;font-weight:bold;cursor:pointer;}
.calc-btn.op{background:#ff9800;}
</style>
</head>
