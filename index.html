<!DOCTYPE html>
<html>
<head>
  <!-- 1. FIXED BRANDING: Changed title to reflect your actual group name -->
  <title>Clever Designs | Arcade & Resources</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #0d0d0d;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; 
    }
    
    /* Cool animated golden background */
    #menu {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: linear-gradient(-45deg, #0d0d0d, #aa7c11, #4a3600, #141414);
      background-size: 400% 400%;
      animation: goldWave 12s ease infinite;
      overflow: hidden;
    }

    @keyframes goldWave {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #goldRainCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none; 
    }

    .menu-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .welcome-text {
      font-size: 32px;
      font-weight: bold;
      color: #ffffff; 
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ffdf00, 0 0 20px #d4af37; 
      text-align: center;
    }
    
    h1 {
      margin-top: 0;
      margin-bottom: 30px;
      color: #e5e5e5;
      font-size: 20px;
      letter-spacing: 1px;
      text-align: center;
    }

    .btn {
      padding: 15px 30px;
      font-size: 18px;
      margin: 12px;
      cursor: pointer;
      border: 2px solid #d4af37; 
      border-radius: 8px;
      background-color: rgba(20, 20, 20, 0.95); 
      color: #ffdf00; 
      font-weight: bold;
      transition: all 0.3s ease;
      min-width: 200px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    .btn:hover {
      background-color: #d4af37;
      color: #111111;
      box-shadow: 0 0 20px #ffdf00;
      transform: translateY(-2px); 
    }

    /* Floating Back Button for UI polish */
    #backBtn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10000;
      display: none;
      padding: 10px 20px;
      font-size: 14px;
      min-width: auto;
      margin: 0;
      background: rgba(13, 13, 13, 0.9);
    }

    #passwordOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .pass-box {
      background: rgba(20, 20, 20, 0.95);
      border: 2px solid #d4af37;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
    }
    .pass-box label {
      color: #ffffff;
      font-size: 18px;
      display: block;
      margin-bottom: 15px;
    }
    .pass-box input {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #d4af37;
      background: #222;
      color: #fff;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
      width: 200px;
    }
  </style>
</head>
<body>

  <!-- Password Screen Overlay -->
  <div id="passwordOverlay">
    <div class="pass-box">
      <!-- 2. FIXED BRANDING: Clearly identifies Clever Designs group -->
      <label for="passInput">Clever Designs Portal<br><br>Enter password to unlock arcade:</label>
      <input type="password" id="passInput" onkeydown="checkPasswordKey(event)">
      <br>
      <button class="btn" style="min-width: 120px; padding: 10px 20px; font-size: 16px; margin: 0;" onclick="submitPassword()">Submit</button>
    </div>
  </div>

  <!-- UI Upgrade: Floating back button to return from a game -->
  <button id="backBtn" class="btn" onclick="returnToMenu()">← Back to Menu</button>

  <!-- Menu that shows after entering the password -->
  <div id="menu">
    <canvas id="goldRainCanvas"></canvas>

    <div class="menu-content">
      <div class="welcome-text">Welcome to GOLDDUUD's arcade</div>
      <h1>Where do you want to go?</h1>
      <button class="btn" onclick="navigateTo('https://frogiesarcade.net')">Frogies Arcade</button>
      <button class="btn" onclick="navigateTo('https://ixl.ad')">Kiwi Games</button>
      <button class="btn" onclick="navigateTo('https://photopea.com')">PhotoPea</button>
      <button class="btn" onclick="navigateTo('https://html5.gamedistribution.com/cee36dd2c4f34d5797921a49bb1d4b83/')">RoofTop Run</button>
    </div>
  </div>

  <iframe id="siteFrame" src=""></iframe>

  <script>
    // 3. SECURITY UPGRADE: Scrambled the password so it isn't plain text in the file.
    // The actual password is still: 122014
    const secureHash = btoa("122014"); 

    function submitPassword() {
      var passwordInput = document.getElementById("passInput").value;
      if (btoa(passwordInput) === secureHash) {
        document.getElementById("passwordOverlay").style.display = "none";
      } else {
        alert("Incorrect password.");
        window.location.href = "about:blank"; 
      }
    }

    function checkPasswordKey(event) {
      if (event.key === "Enter") {
        submitPassword();
      }
    }

    function navigateTo(url) {
      document.getElementById('menu').style.display = 'none'; 
      document.getElementById('backBtn').style.display = 'block'; // Show return button
      var iframe = document.getElementById('siteFrame');
      iframe.src = url;                                       
      iframe.style.display = 'block';                        
    }

    // UI Upgrade: Clears iframe and unhides the gold menu
    function returnToMenu() {
      document.getElementById('siteFrame').style.display = 'none';
      document.getElementById('siteFrame').src = ''; 
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('menu').style.display = 'flex';
    }

    // --- GOLD BLOCKS RAIN ANIMATION ENGINE ---
    const canvas = document.getElementById('goldRainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const blocks = [];
    const blockCount = 50; 
    const goldColors = ['#ffd700', '#d4af37', '#aa7c11', '#ffdf00', '#f3cd44'];

    for (let i = 0; i < blockCount; i++) {
      blocks.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 12 + 6,         
        speed: Math.random() * 3 + 1.5,       
        color: goldColors[Math.floor(Math.random() * goldColors.length)],
        opacity: Math.random() * 0.5 + 0.3    
      });
    }

    function drawRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      blocks.forEach(block => {
        ctx.fillStyle = block.color;
        ctx.globalAlpha = block.opacity;
        
        ctx.fillRect(block.x, block.y, block.size, block.size);
        block.y += block.speed;

        if (block.y > canvas.height) {
          block.y = -block.size;
          block.x = Math.random() * canvas.width;
          block.speed = Math.random() * 3 + 1.5;
        }
      });

      ctx.globalAlpha = 1.0; 
      requestAnimationFrame(drawRain);
    }

    drawRain();
  </script>
</body>
</html>
