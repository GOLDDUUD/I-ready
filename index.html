<!DOCTYPE html>
<html>
<head>
  <!-- Change your website title right here -->
  <title>Clever | Recources</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* Hidden until you click a button */
    }
    
    /* Cool animated golden background */
    #menu {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      /* Shifting gold gradient colors */
      background: linear-gradient(-45deg, #111111, #d4af37, #aa7c11, #1a1a1a);
      background-size: 400% 400%;
      animation: goldWave 10s ease infinite;
    }

    /* Keyframes that make the background shift smoothly */
    @keyframes goldWave {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Welcome text style with glow effect */
    .welcome-text {
      font-size: 32px;
      font-weight: bold;
      color: #ffffff; 
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ffdf00, 0 0 20px #d4af37; /* Gold neon glow */
    }
    
    h1 {
      margin-top: 0;
      margin-bottom: 30px;
      color: #e5e5e5;
      font-size: 20px;
      letter-spacing: 1px;
    }

    /* Dark/Gold themed sleek buttons */
    .btn {
      padding: 15px 30px;
      font-size: 18px;
      margin: 12px;
      cursor: pointer;
      border: 2px solid #d4af37; /* Gold border */
      border-radius: 8px;
      background-color: rgba(26, 26, 26, 0.9); /* Dark semi-transparent inside */
      color: #ffdf00; /* Bright gold text */
      font-weight: bold;
      transition: all 0.3s ease;
      min-width: 200px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    /* Hover effect makes the button light up gold */
    .btn:hover {
      background-color: #d4af37;
      color: #111111;
      box-shadow: 0 0 15px #ffdf00;
      transform: translateY(-2px); /* Slight lifting motion */
    }
  </style>
</head>
<body>

  <!-- Menu that shows after entering the password -->
  <div id="menu">
    <div class="welcome-text">Welcome to GOLDDUUD's arcade</div>
    <h1>Where do you want to go?</h1>
    <button class="btn" onclick="navigateTo('https://frogiesarcade.net')">Frogies Arcade</button>
    <button class="btn" onclick="navigateTo('https://ixl.ad')">IXL Ad</button>
  </div>

  <!-- The iframe that will display the selected website inside your page -->
  <iframe id="siteFrame" src=""></iframe>

  <script>
    // Simple client-side password protection
    var password = prompt("Please enter the password to access this site:");
    if (password !== "122014") {
      alert("Incorrect password.");
      window.location.href = "about:blank"; // Redirects away if wrong
    }

    // Function to load the site inside the iframe
    function navigateTo(url) {
      document.getElementById('menu').style.display = 'none'; // Hide the menu buttons
      var iframe = document.getElementById('siteFrame');
      iframe.src = url;                                       // Load the website URL
      iframe.style.display = 'block';                        // Show the iframe full screen
    }
  </script>
</body>
</html>
