<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Research Assistant</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #f6f6f6; }
        
        /* Top Navigation Bar */
        .navbar { height: 50px; background: #ffffff; border-bottom: 1px solid #a2a9b1; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .logo { font-weight: bold; font-size: 18px; color: #202122; }
        
        /* The Secret Button - disguised as a small dot or icon */
        .secret-btn { width: 10px; height: 10px; background: #e0e0e0; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .secret-btn:hover { background: #3366cc; }

        /* Main Content Container */
        .content-container { height: calc(100% - 50px); position: relative; }
        
        /* Wikipedia Frame */
        iframe { width: 100%; height: 100%; border: none; }

        /* Hidden Snake Game Overlay */
        .game-overlay { 
            display: none; /* Hidden by default */
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #111; color: white; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 999; 
        }
        canvas { background-color: #000; border: 4px solid #333; }
        .score { font-size: 20px; margin-top: 10px; }
        .game-title { margin-bottom: 10px; font-size: 24px; color: #4CAF50; }
    </style>
</head>
<body>

    <!-- Top Bar looks like a generic research tool -->
    <div class="navbar">
        <div class="logo">🌐 Wiki Research Portal v2.4</div>
        <!-- Clicking this harmless dot toggles between Wiki and Snake -->
        <div class="secret-btn" onclick="toggleGame()" title="Open System Settings"></div>
    </div>

    <div class="content-container">
        <!-- Main Wikipedia Window (Will not give "refused to connect" error) -->
        <iframe src="https://wikipedia.org"></iframe>

        <!-- Hidden Snake Game Container -->
        <div id="snakeGameContainer" class="game-overlay">
            <div class="game-title">Retro Snake Mode</div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="score">Score: <span id="scoreVal">0</span></div>
            <p style="color: #888; font-size: 12px; margin-top: 15px;">Click the secret dot in the top right to switch back to Wiki</p>
        </div>
    </div>

    <script>
        // Secret Toggle Function
        let gameActive = false;
        function toggleGame() {
            const container = document.getElementById("snakeGameContainer");
            gameActive = !gameActive;
            if (gameActive) {
                container.style.display = "flex";
                resetGame();
            } else {
                container.style.display = "none";
            }
        }

        // --- Snake Game Logic ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameLoopInterval;

        function gameLoop() {
            if (!gameActive) return;
            
            if (hasGameEnded()) {
                alert("Game Over! Score: " + score);
                resetGame();
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        function drawSnake() {
            ctx.fillStyle = "#4CAF50";
            snake.forEach(part => ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2));
        }
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                document.getElementById("scoreVal").innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            snake.forEach(part => { if (part.x === food.x && part.y === food.y) generateFood(); });
        }
        function drawFood() { ctx.fillStyle = "#FF5722"; ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2); }
        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount;
        }
        function resetGame() {
            snake = [{ x: 10, y: 10 }]; dx = 1; dy = 0; score = 0;
            document.getElementById("scoreVal").innerText = score;
            generateFood();
            clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(gameLoop, 100);
        }

        document.addEventListener("keydown", e => {
            if (!gameActive) return;
            if (e.keyCode === 37 && dx !== 1) { dx = -1; dy = 0; }
            if (e.keyCode === 38 && dy !== 1) { dx = 0; dy = -1; }
            if (e.keyCode === 39 && dx !== -1) { dx = 1; dy = 0; }
            if (e.keyCode === 40 && dy !== -1) { dx = 0; dy = 1; }
        });
    </script>
</body>
</html>
