<!DOCTYPE html>
<html>

  <title>Clever | Recources</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* Hidden until you click a button */
    }
    
    /* Cool animated golden background */
    #menu {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      /* Shifting gold gradient colors */
      background: linear-gradient(-45deg, #0d0d0d, #aa7c11, #4a3600, #141414);
      background-size: 400% 400%;
      animation: goldWave 12s ease infinite;
      overflow: hidden;
    }

    /* Keyframes that make the background shift smoothly */
    @keyframes goldWave {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Canvas wrapper for the raining blocks */
    #goldRainCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none; /* Allows clicks to pass through to the buttons */
    }

    /* Forces text and buttons to stay on top of the animation */
    .menu-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Welcome text style with glow effect */
    .welcome-text {
      font-size: 32px;
      font-weight: bold;
      color: #ffffff; 
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ffdf00, 0 0 20px #d4af37; /* Gold neon glow */
      text-align: center;
    }
