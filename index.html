<!DOCTYPE html>
<html>
<head>
  <!-- Change your website title right here -->
  <title>Clever | Recources</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* Hidden until you click a button */
    }
    
    /* Cool animated golden background */
    #menu {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      /* Shifting gold gradient colors */
      background: linear-gradient(-45deg, #0d0d0d, #aa7c11, #4a3600, #141414);
      background-size: 400% 400%;
      animation: goldWave 12s ease infinite;
      overflow: hidden;
    }

    /* Keyframes that make the background shift smoothly */
    @keyframes goldWave {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Canvas wrapper for the raining blocks */
    #goldRainCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none; /* Allows clicks to pass through to the buttons */
    }

    /* Forces text and buttons to stay on top of the animation */
    .menu-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Welcome text style with glow effect */
    .welcome-text {
      font-size: 32px;
      font-weight: bold;
      color: #ffffff; 
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ffdf00, 0 0 20px #d4af37; /* Gold neon glow */
      text-align: center;
    }
    
    h1 {
      margin-top: 0;
      margin-bottom: 30px;
      color: #e5e5e5;
      font-size: 20px;
      letter-spacing: 1px;
      text-align: center;
    }

    /* Dark/Gold themed sleek buttons */
    .btn {
      padding: 15px 30px;
      font-size: 18px;
      margin: 12px;
      cursor: pointer;
      border: 2px solid #d4af37; /* Gold border */
      border-radius: 8px;
      background-color: rgba(20, 20, 20, 0.95); /* Dark block inside */
      color: #ffdf00; /* Bright gold text */
      font-weight: bold;
      transition: all 0.3s ease;
      min-width: 200px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    /* Hover effect makes the button light up gold */
    .btn:hover {
      background-color: #d4af37;
      color: #111111;
      box-shadow: 0 0 20px #ffdf00;
      transform: translateY(-2px); /* Slight lifting motion */
    }

    /* Password overlay box styling to replace the prompt */
    #passwordOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .pass-box {
      background: rgba(20, 20, 20, 0.95);
      border: 2px solid #d4af37;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
    }
    .pass-box label {
      color: #ffffff;
      font-size: 18px;
      display: block;
      margin-bottom: 15px;
    }
    .pass-box input {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #d4af37;
      background: #222;
      color: #fff;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
      width: 200px;
    }
  </style>
</head>
<body>

  <!-- Password Screen Overlay -->
  <div id="passwordOverlay">
    <div class="pass-box">
      <label for="passInput">Please enter the password to access this site:</label>
      <input type="password" id="passInput" onkeydown="checkPasswordKey(event)">
      <br>
      <button class="btn" style="min-width: 120px; padding: 10px 20px; font-size: 16px; margin: 0;" onclick="submitPassword()">Submit</button>
    </div>
  </div>

  <!-- Menu that shows after entering the password -->
  <div id="menu">
    <!-- HTML5 canvas for drawing the rain -->
    <canvas id="goldRainCanvas"></canvas>

    <!-- Wrapper keeps buttons working and interactive above the animation -->
    <div class="menu-content">
      <div class="welcome-text">Welcome to GOLDDUUD's arcade</div>
      <h1>Where do you want to go?</h1>
      <button class="btn" onclick="navigateTo('https://frogiesarcade.net')">Frogies Arcade</button>
      <button class="btn" onclick="navigateTo('https://ixl.ad')">Kiwi Games</button>
      <button class="btn" onclick="navigateTo('https://photopea.com')">PhotoPea</button>
      <button class="btn" onclick="navigateTo('https://eaglercraft.com/')">Eagler Craft</button>
    </div>
  </div>

  <!-- The iframe that will display the selected website inside your page -->
  <iframe id="siteFrame" src=""></iframe>

  <script>
    // Password verification system
    function submitPassword() {
      var passwordInput = document.getElementById("passInput").value;
      if (passwordInput === "122014") {
        document.getElementById("passwordOverlay").style.display = "none";
      } else {
        alert("Incorrect password.");
        window.location.href = "about:blank"; // Redirects away if wrong
      }
    }

    // Allows pressing Enter to submit password
    function checkPasswordKey(event) {
      if (event.key === "Enter") {
        submitPassword();
      }
    }

    // Function to load the site inside the iframe
    function navigateTo(url) {
      document.getElementById('menu').style.display = 'none'; // Hide the menu buttons
      var iframe = document.getElementById('siteFrame');
      iframe.src = url;                                       // Load the website URL
      iframe.style.display = 'block';                        // Show the iframe full screen
    }

    // --- GOLD BLOCKS RAIN ANIMATION ENGINE ---
    const canvas = document.getElementById('goldRainCanvas');
    const ctx = canvas.getContext('2d');

    // Make canvas fill the full window size
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Setup golden cube array
    const blocks = [];
    const blockCount = 50; // Total number of blocks falling at once
    const goldColors = ['#ffd700', '#d4af37', '#aa7c11', '#ffdf00', '#f3cd44'];

    for (let i = 0; i < blockCount; i++) {
      blocks.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 12 + 6,         // Size of block (6px to 18px)
        speed: Math.random() * 3 + 1.5,       // Fall rate
        color: goldColors[Math.floor(Math.random() * goldColors.length)],
        opacity: Math.random() * 0.5 + 0.3    // Keeps them subtle in the background
      });
    }

    // Continuous render loop
    function drawRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      blocks.forEach(block => {
        ctx.fillStyle = block.color;
        ctx.globalAlpha = block.opacity;
        
        // Draw the block
        ctx.fillRect(block.x, block.y, block.size, block.size);

        // Update block path downward
        block.y += block.speed;

        // Reset block back to top once it hits the bottom
        if (block.y > canvas.height) {
          block.y = -block.size;
          block.x = Math.random() * canvas.width;
          block.speed = Math.random() * 3 + 1.5;
        }
      });

      ctx.globalAlpha = 1.0; // Reset canvas transparency
      requestAnimationFrame(drawRain);
    }

    // Run the rain engine
    drawRain();
  </script>
</body>
</html>
