<!DOCTYPE html>
<html>
<head>
  <!-- Change your website title right here -->
  <title>Clever | Recources</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* Hidden until you click a button */
    }
    /* Menu container styles */
    #menu {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      background-color: #f0f2f5;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    .btn {
      padding: 15px 30px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      transition: background-color 0.2s;
      min-width: 180px;
    }
    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Menu that shows after entering the password -->
  <div id="menu">
    <h1>Where do you want to go?</h1>
    <button class="btn" onclick="navigateTo('https://frogiesarcade.net')">Frogies Arcade</button>
    <button class="btn" onclick="navigateTo('https://ixl.ad')">IXL Ad</button>
  </div>

  <!-- The iframe that will display the selected website inside your page -->
  <iframe id="siteFrame" src=""></iframe>

  <script>
    // Simple client-side password protection
    var password = prompt("Please enter the password to access this site:");
    if (password !== "122014") {
      alert("Incorrect password.");
      window.location.href = "about:blank"; // Redirects away if wrong
    }

    // Function to load the site inside the iframe
    function navigateTo(url) {
      document.getElementById('menu').style.display = 'none'; // Hide the menu buttons
      var iframe = document.getElementById('siteFrame');
      iframe.src = url;                                       // Load the website URL
      iframe.style.display = 'block';                        // Show the iframe full screen
    }
  </script>
</body>
</html>
