<!DOCTYPE html>
<html>
<head>
  <!-- Change your website title right here -->
  <title>Clever | Recources</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* Hidden until you click a button */
    }
    
    /* Cool animated golden background */
    #menu {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      /* Shifting gold gradient colors */
      background: linear-gradient(-45deg, #0d0d0d, #aa7c11, #4a3600, #141414);
      background-size: 400% 400%;
      animation: goldWave 12s ease infinite;
      overflow: hidden;
    }

    /* Keyframes that make the background shift smoothly */
    @keyframes goldWave {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Canvas wrapper for the raining blocks */
    #goldRainCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none; /* Allows clicks to pass through to the buttons */
    }

    /* Forces text and buttons to stay on top of the animation */
    .menu-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Welcome text style with glow effect */
    .welcome-text {
      font-size: 32px;
      font-weight: bold;
      color: #ffffff; 
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ffdf00, 0 0 20px #d4af37; /* Gold neon glow */
      text-align: center;
    }
    
    .sub-text {
      font-size: 14px;
      color: #cccccc;
      margin-bottom: 30px;
      text-align: center;
    }

    /* Stylish golden UI button */
    .gold-btn {
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: 2px solid #ffdf00;
      color: #000;
      padding: 15px 40px;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
      transition: all 0.3s ease;
    }

    /* Hover animations for the button */
    .gold-btn:hover {
      background: linear-gradient(135deg, #ffdf00 0%, #d4af37 100%);
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 25px rgba(255, 223, 0, 0.6);
    }

    .gold-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <!-- The Launch Menu Screen -->
  <div id="menu">
    <canvas id="goldRainCanvas"></canvas>
    
    <div class="menu-content">
      <div class="welcome-text">Welcome back</div>
      <div class="sub-text">Click below to load your platform</div>
      <button class="gold-btn" onclick="launchPlatform()">Launch</button>
    </div>
  </div>

  <!-- The Frame that will hold the website -->
  <iframe id="siteFrame" src=""></iframe>

  <script>
    function launchPlatform() {
      // Ask the user where they want to go
      var choice = prompt("Where do you wanna go? (type 'frogies arcade' or 'Kiwi Games')");
      
      if (choice === null) return; // User pressed cancel
      
      var choiceClean = choice.trim().toLowerCase();
      var frame = document.getElementById("siteFrame");
      var menu = document.getElementById("menu");
      
      if (choiceClean === "frogies arcade") {
        frame.src = "https://frogiesarcade.com"; // Replace with actual Frogies URL if different
        menu.style.display = "none";
        frame.style.display = "block";
      } else if (choiceClean === "kiwi games") {
        frame.src = "https://kiwigames.com"; // Replace with actual Kiwi Games URL if different
        menu.style.display = "none";
        frame.style.display = "block";
      } else {
        alert("Invalid option. Please type either 'frogies arcade' or 'Kiwi Games'.");
      }
    }

    // --- Matrix Golden Rain Animation ---
    const canvas = document.getElementById('goldRainCanvas');
    const ctx = canvas.getContext('2d');

    // Resize canvas dynamically
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Block properties
    const columns = Math.floor(canvas.width / 20);
    const drops = [];
    // Initialize drops out of view
    for (let x = 0; x < columns; x++) {
      drops[x] = Math.random() * -100; 
    }

    function draw() {
      // Semi-transparent black clear to create trailing blur effect
      ctx.fillStyle = 'rgba(13, 13, 13, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Set gold shading configurations
      ctx.fillStyle = '#d4af37'; 
      ctx.font = '15px monospace';

      for (let i = 0; i < drops.length; i++) {
        // Pick random characters/numbers to mimic digital rain blocks
        const text = Math.floor(Math.random() * 10);
        const x = i * 20;
        const y = drops[i] * 20;

        // Randomly alternate shades of gold for visual depth
        ctx.fillStyle = Math.random() > 0.5 ? '#ffdf00' : '#aa7c11';
        ctx.fillText(text, x, y);

        // Reset drop back to top after leaving screen with randomized delay
        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    // Run code engine loop
    setInterval(draw, 33);
  </script>

</body>
</html>
